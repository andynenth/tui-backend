# docker-compose.dev-full.yml
# Full development setup with both backend and frontend hot reload
version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      # Mount source code for hot reload
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - ./requirements.txt:/app/requirements.txt
      - ./favicon.ico:/app/favicon.ico
      # Mount static directory to see frontend changes
      - ./backend/static:/app/backend/static
    ports:
      - "${API_PORT}:${API_PORT}"
    env_file: .env
    command: >
      uvicorn backend.api.main:app
      --host ${API_HOST}
      --port ${API_PORT}
      --reload
      --workers 1
    environment:
      - PYTHONPATH=/app
      - DEBUG=${DEBUG}
      - MAX_SCORE=${MAX_SCORE}
      - MAX_ROUNDS=${MAX_ROUNDS}
      - BOT_ENABLED=${BOT_ENABLED}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-dev:
    image: node:23-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./backend/static:/static
    ports:
      - "3000:3000"  # For development server if needed
    command: >
      sh -c "npm install && 
             npm run dev"
    environment:
      - NODE_ENV=development