<!-- frontend/index.html -->
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <script>
      // Dynamically adjust viewport scale based on screen width
      (function() {
        const viewportMeta = document.querySelector('meta[name="viewport"]');
        const screenWidth = window.screen.width;
        
        // Default scale is 1 (no zoom)
        let scale = 1;
        
        // Only scale down for screens smaller than 400px
        if (screenWidth < 360) {
          scale = 0.80;  // Very small screens
        } else if (screenWidth < 380) {
          scale = 0.85;  // Small screens like older iPhones
        } else if (screenWidth < 400) {
          scale = 0.90;  // iPhone 12 Pro (390px), iPhone SE (375px)
        }
        // screenWidth >= 400: scale remains 1 (default)
        
        // Update viewport meta tag
        viewportMeta.content = `width=device-width, initial-scale=${scale}, maximum-scale=1, user-scalable=no`;
      })();
    </script>
    <title>Castellan Game</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/bundle.css" />
  </head>
  <body>
    <div id="root">
      <div style="padding: 20px; text-align: center; font-family: system-ui, -apple-system, sans-serif;">
        <div style="margin: 20px auto; width: 50px; height: 50px; border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        <p>Loading Castellan...</p>
        <noscript>
          <p style="color: red;">JavaScript is required to run this application.</p>
        </noscript>
      </div>
    </div>
    <script>
      // Minimal telemetry system for bundle loading
      const telemetry = {
        sessionId: Math.random().toString(36).substring(7),
        startTime: Date.now(),
        events: [],
        
        log(event, data) {
          const entry = {
            timestamp: Date.now(),
            elapsed: Date.now() - this.startTime,
            event,
            ...data,
            userAgent: navigator.userAgent,
            connection: navigator.connection ? {
              effectiveType: navigator.connection.effectiveType,
              rtt: navigator.connection.rtt,
              downlink: navigator.connection.downlink
            } : null
          };
          
          this.events.push(entry);
          
          // Send critical events immediately
          if (event === 'bundle_error' || event === 'load_timeout' || event === 'load_failed') {
            // Telemetry disabled for now
            // this.send([entry]);
          }
        },
        
        send(events = this.events) {
          if (events.length === 0) return;
          
          const data = JSON.stringify({
            sessionId: this.sessionId,
            events: events
          });
          
          // Use sendBeacon for reliability
          if (navigator.sendBeacon) {
            navigator.sendBeacon('/api/telemetry', data);
          } else {
            // Fallback to fetch
            fetch('/api/telemetry', {
              method: 'POST',
              body: data,
              headers: { 'Content-Type': 'application/json' },
              keepalive: true
            }).catch(() => {});
          }
        }
      };
      
      // Enhanced bundle loading with retry logic
      (function() {
        let retryCount = 0;
        const maxRetries = 3;
        const baseDelay = 2000;
        
        telemetry.log('page_load_start', {
          url: window.location.href
        });
        
        function updateLoadingMessage(message, isError = false) {
          const root = document.getElementById('root');
          if (isError) {
            root.innerHTML = '<div style="padding: 20px; color: red;">' + message + '</div>';
          } else {
            const p = root.querySelector('p');
            if (p) p.textContent = message;
          }
        }
        
        function loadBundle() {
          const loadStart = Date.now();
          const script = document.createElement('script');
          script.type = 'module'; // Required for ESM format
          script.src = '/bundle.js';
          
          // Add timestamp to bypass cache on retry
          if (retryCount > 0) {
            script.src += '?retry=' + Date.now();
          }
          
          telemetry.log('bundle_load_attempt', {
            attempt: retryCount + 1,
            url: script.src
          });
          
          script.onload = function() {
            const loadTime = Date.now() - loadStart;
            script.loaded = true; // Mark as loaded to prevent timeout
            
            telemetry.log('bundle_load_success', {
              attempt: retryCount + 1,
              loadTime
            });
            
            // Report performance metrics if available
            if (window.performance && performance.getEntriesByName) {
              const perfData = performance.getEntriesByName(script.src)[0];
              if (perfData && perfData.transferSize) {
                telemetry.log('performance_metrics', {
                  transferSize: perfData.transferSize,
                  encodedBodySize: perfData.encodedBodySize,
                  decodedBodySize: perfData.decodedBodySize,
                  duration: perfData.duration
                });
              }
            }
            
            // telemetry.send();
          };
          
          script.onerror = function(error) {
            const loadTime = Date.now() - loadStart;
            
            telemetry.log('bundle_error', {
              attempt: retryCount + 1,
              loadTime,
              error: 'Script load failed'
            });
            
            retryCount++;
            
            if (retryCount < maxRetries) {
              const delay = baseDelay * Math.pow(2, retryCount - 1);
              updateLoadingMessage('Loading failed, retrying in ' + (delay/1000) + ' seconds... (Attempt ' + (retryCount + 1) + '/' + maxRetries + ')');
              setTimeout(loadBundle, delay);
            } else {
              telemetry.log('load_failed', {
                totalAttempts: retryCount
              });
              // telemetry.send();
              updateLoadingMessage(
                'Unable to load the game after ' + maxRetries + ' attempts. ' +
                '<br><br>Please try:' +
                '<br>• Checking your internet connection' +
                '<br>• Refreshing the page' +
                '<br>• Using a different network' +
                '<br><br><button onclick="location.reload()" style="padding: 10px 20px; font-size: 16px;">Refresh Page</button>',
                true
              );
            }
          };
          
          // Timeout detection (30 seconds)
          setTimeout(function() {
            if (script.parentNode && !script.loaded) {
              telemetry.log('load_timeout', {
                attempt: retryCount + 1,
                elapsed: Date.now() - loadStart
              });
              script.onerror(new Error('Load timeout'));
            }
          }, 30000);
          
          document.body.appendChild(script);
        }
        
        loadBundle();
      })();
      
      // Send telemetry before page unload
      window.addEventListener('beforeunload', function() { telemetry.send(); });
    </script>
  </body>
</html>
