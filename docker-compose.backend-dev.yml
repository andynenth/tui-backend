version: '3.8'

services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.backend-dev
    image: liap-tui-backend-dev:latest
    container_name: liap-tui-backend-dev
    ports:
      - "5050:5050"  # Direct port for backend development
    volumes:
      # Mount source code for hot reload
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./requirements.txt:/app/requirements.txt

      # Database persistence - same as prod
      - ./data:/app/data

      # Logs persistence - same as prod
      - ./logs:/app/logs

      # Static files from frontend build
      - ./backend/static:/app/backend/static

    environment:
      # Database - same as prod
      - DATABASE_PATH=/app/data/game_events.db

      # Application settings - development mode
      - API_HOST=0.0.0.0
      - API_PORT=5050
      - DEBUG=true  # Enable debug mode

      # Development specific
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

      # Version (can be overridden)
      - APP_VERSION=${APP_VERSION:-dev}

      # Game settings - same as prod
      - MAX_SCORE=50
      - MAX_ROUNDS=20
      - BOT_ENABLED=true

      # CORS for development
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5050,http://localhost:5173

      # Rate limiting - enabled with dev-friendly client identification
      - RATE_LIMIT_ENABLED=true

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Use command to enable hot reload
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "5050", "--reload", "--reload-dir", "/app/backend", "--reload-dir", "/app/shared"]
