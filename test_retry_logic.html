<!DOCTYPE html>
<html>
<head>
    <title>Test Retry Logic</title>
</head>
<body>
    <h1>Testing Bundle Retry Logic</h1>
    <p>This page simulates a failed bundle load to test retry mechanism.</p>
    <button onclick="testRetry()">Simulate Bundle Load Failure</button>
    <div id="output"></div>
    
    <script>
        // Copy the telemetry and retry logic from index.html
        const telemetry = {
            sessionId: Math.random().toString(36).substring(7),
            startTime: Date.now(),
            events: [],
            
            log(event, data) {
                const entry = {
                    timestamp: Date.now(),
                    elapsed: Date.now() - this.startTime,
                    event,
                    ...data,
                    userAgent: navigator.userAgent
                };
                
                this.events.push(entry);
                document.getElementById('output').innerHTML += `<p>${new Date().toLocaleTimeString()} - ${event}: ${JSON.stringify(data)}</p>`;
                
                if (event === 'bundle_error' || event === 'load_timeout' || event === 'load_failed') {
                    this.send([entry]);
                }
            },
            
            send(events = this.events) {
                if (events.length === 0) return;
                
                const data = JSON.stringify({
                    sessionId: this.sessionId,
                    events: events
                });
                
                fetch('/api/telemetry', {
                    method: 'POST',
                    body: data,
                    headers: { 'Content-Type': 'application/json' }
                }).catch(() => {});
            }
        };
        
        function testRetry() {
            document.getElementById('output').innerHTML = '<h3>Starting test...</h3>';
            let retryCount = 0;
            const maxRetries = 3;
            const baseDelay = 2000;
            
            function loadBundle() {
                const loadStart = Date.now();
                const script = document.createElement('script');
                // Intentionally use a non-existent file to trigger errors
                script.src = '/bundle-does-not-exist.js?attempt=' + (retryCount + 1);
                
                telemetry.log('bundle_load_attempt', {
                    attempt: retryCount + 1,
                    url: script.src
                });
                
                script.onerror = function(error) {
                    const loadTime = Date.now() - loadStart;
                    
                    telemetry.log('bundle_error', {
                        attempt: retryCount + 1,
                        loadTime,
                        error: 'Script load failed'
                    });
                    
                    retryCount++;
                    
                    if (retryCount < maxRetries) {
                        const delay = baseDelay * Math.pow(2, retryCount - 1);
                        document.getElementById('output').innerHTML += `<p style="color: orange;">Retry in ${delay/1000} seconds...</p>`;
                        setTimeout(loadBundle, delay);
                    } else {
                        telemetry.log('load_failed', {
                            totalAttempts: retryCount
                        });
                        telemetry.send();
                        document.getElementById('output').innerHTML += `<p style="color: red;">Failed after ${retryCount} attempts!</p>`;
                    }
                };
                
                document.body.appendChild(script);
            }
            
            loadBundle();
        }
    </script>
</body>
</html>
