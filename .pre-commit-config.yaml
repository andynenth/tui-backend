repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^backend/static/.*$  # Exclude generated static files
      - id: end-of-file-fixer
        exclude: ^backend/static/.*$  # Exclude generated static files
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=600']  # Allow up to 600KB for compiled JavaScript chunks
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        files: ^backend/.*\.py$

  # Pylint is commented out because it's too strict and blocks commits
