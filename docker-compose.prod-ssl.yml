version: '3.8'

services:
  liap-tui:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: liap-tui:latest
    container_name: liap-tui-game
    ports:
      - "8080:5050"  # Changed to 8080 for nginx SSL proxy
    volumes:
      # Database persistence
      - game_data:/app/data
      # Logs persistence (optional)
      - ./logs:/app/logs
    environment:
      # Database paths
      - DATABASE_PATH=/app/data/game_events.db
      - TELEMETRY_DB_PATH=/app/data/telemetry_data.db
      
      # Application settings
      - API_HOST=0.0.0.0
      - API_PORT=5050
      - DEBUG=false
      
      # Version (can be overridden)
      - APP_VERSION=${APP_VERSION:-}
      
      # Game settings
      - MAX_SCORE=50
      - MAX_ROUNDS=20
      - BOT_ENABLED=true
      
      # CORS - Update with your domains
      - ALLOWED_ORIGINS=http://localhost,https://castellan.andynenth.dev,http://castellan.andynenth.dev
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  game_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/liap-tui-data