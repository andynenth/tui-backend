version: '3.8'

services:
  liap-tui:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: liap-tui:latest
    container_name: liap-tui-game
    ports:
      - "80:5050"
    volumes:
      # Database persistence - use local directory instead of /home/ubuntu
      - ./data:/app/data
      # Logs persistence
      - ./logs:/app/logs
    environment:
      # Database
      - DATABASE_PATH=/app/data/game_events.db

      # Application settings
      - API_HOST=0.0.0.0
      - API_PORT=5050
      - DEBUG=false

      # Version (can be overridden)
      - APP_VERSION=${APP_VERSION:-}

      # Game settings
      - MAX_SCORE=50
      - MAX_ROUNDS=20
      - BOT_ENABLED=true

      # CORS for local testing
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s