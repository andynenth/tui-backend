<!-- frontend/index.html -->
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <script>
      // Dynamically adjust viewport scale based on screen width
      (function() {
        const viewportMeta = document.querySelector('meta[name="viewport"]');
        const screenWidth = window.screen.width;
        
        // Default scale is 1 (no zoom)
        let scale = 1;
        
        // Only scale down for screens smaller than 400px
        if (screenWidth < 360) {
          scale = 0.80;  // Very small screens
        } else if (screenWidth < 380) {
          scale = 0.85;  // Small screens like older iPhones
        } else if (screenWidth < 400) {
          scale = 0.90;  // iPhone 12 Pro (390px), iPhone SE (375px)
        }
        // screenWidth >= 400: scale remains 1 (default)
        
        // Update viewport meta tag
        viewportMeta.content = `width=device-width, initial-scale=${scale}, maximum-scale=1, user-scalable=no`;
      })();
    </script>
    <title>Castellan Game</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/bundle.css" />
  </head>
  <body>
    <div id="root">
      <div style="padding: 20px; text-align: center; font-family: system-ui, -apple-system, sans-serif;">
        <div style="margin: 20px auto; width: 50px; height: 50px; border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        <p>Loading Castellan...</p>
        <noscript>
          <p style="color: red;">JavaScript is required to run this application.</p>
        </noscript>
      </div>
    </div>
    <script>
      // Script loading error handler
      window.addEventListener('error', function(e) {
        if (e.filename && e.filename.includes('bundle.js')) {
          document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red;">Failed to load application bundle. Please check your connection and refresh the page.</div>';
        }
      });
    </script>
    <script src="/bundle.js" onerror="document.getElementById('root').innerHTML = '<div style=\'padding: 20px; color: red;\'>Failed to load bundle.js. Error details: ' + this.src + '</div>'"></script>
  </body>
</html>
