version: '3.8'

services:
  liap-tui:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: liap-tui:test
    container_name: liap-tui-test
    ports:
      - "5051:5050"
    volumes:
      # Database persistence - use local directory for testing
      - ./test-data:/app/data
    environment:
      # Database
      - DATABASE_PATH=/app/data/game_events.db
      
      # Application settings
      - API_HOST=0.0.0.0
      - API_PORT=5050
      - DEBUG=false
      
      # Game settings
      - MAX_SCORE=50
      - MAX_ROUNDS=20
      - BOT_ENABLED=true
      
      # CORS
      - ALLOWED_ORIGINS=http://localhost
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s